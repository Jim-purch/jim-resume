<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
<pattern id="dg" width="30" height="30" patternUnits="userSpaceOnUse">
<circle cx="1.1" cy="1.1" r="1" fill="#2C2A26" opacity="0.05"/>
</pattern>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="800" height="440" fill="#F1ECE3"/>
<rect width="800" height="440" fill="url(#dg)"/>

<!-- voice waveform -->
<polyline points="110,225 122,205 134,243 146,199 158,249 170,207 182,241 194,215 206,235 218,221 230,229 242,223 254,227 266,225 278,225 290,225" fill="none" stroke="#2C2A26" stroke-width="2" stroke-linejoin="round"/>

<!-- the conversation -->
<polygon points="356,274 392,274 368,300" fill="#F6F2EA" stroke="#2C2A26" stroke-width="2"/>
<rect x="330" y="172" width="160" height="104" rx="20" fill="#F6F2EA" stroke="#2C2A26" stroke-width="2"/>
<circle cx="385" cy="224" r="5" fill="#2C2A26"/>
<circle cx="410" cy="224" r="5" fill="#2C2A26"/>
<circle cx="435" cy="224" r="5" fill="#2C2A26"/>

<!-- reply, as sound -->
<circle cx="610" cy="224" r="6" fill="#C1874B"/>
<g fill="none" stroke="#B87F45" stroke-width="2.4" stroke-linecap="round">
<path d="M 634 200 A 34 34 0 0 1 634 248"/>
<path d="M 652 184 A 58 58 0 0 1 652 264" stroke-opacity="0.65"/>
<path d="M 670 168 A 82 82 0 0 1 670 280" stroke-opacity="0.4"/>
</g>

<!-- flow baseline -->
<line x1="110" y1="350" x2="690" y2="350" stroke="#A8A29E" stroke-width="1.5" stroke-dasharray="1 7"/>
<g fill="none" stroke="#A8A29E" stroke-width="1.5">
<polyline points="394,344 402,350 394,356"/>
<polyline points="614,344 622,350 614,356"/>
</g>

<text x="48" y="398" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#A8A29E">FIG.05 · VOICE INTO THOUGHT</text>
<rect width="800" height="440" filter="url(#grain)" opacity="0.045"/>
</svg>
