<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
<pattern id="dg" width="30" height="30" patternUnits="userSpaceOnUse">
<circle cx="1.1" cy="1.1" r="1" fill="#2C2A26" opacity="0.05"/>
</pattern>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="800" height="440" fill="#F1ECE3"/>
<rect width="800" height="440" fill="url(#dg)"/>

<!-- stacked cloud sheets -->
<polygon points="270,140 560,140 640,205 350,205" fill="none" stroke="#A8A29E" stroke-width="1.5" stroke-opacity="0.6"/>
<polygon points="225,185 525,185 610,255 310,255" fill="none" stroke="#2C2A26" stroke-width="1.5" stroke-opacity="0.5"/>
<polygon points="180,235 490,235 585,315 275,315" fill="#F6F2EA" stroke="#2C2A26" stroke-width="2"/>
<g stroke="#2C2A26" stroke-opacity="0.35" stroke-width="1">
<line x1="282" y1="235" x2="377" y2="315"/>
<line x1="385" y1="235" x2="480" y2="315"/>
<line x1="211" y1="261" x2="521" y2="261"/>
<line x1="243" y1="288" x2="553" y2="288"/>
</g>

<!-- search ray -->
<line x1="110" y1="128" x2="432" y2="283" stroke="#B87F45" stroke-width="1.8" stroke-dasharray="6 6"/>
<circle cx="110" cy="128" r="5" fill="#C1874B"/>

<!-- hit cell -->
<polygon points="400,268 470,268 500,296 430,296" fill="#C1874B" fill-opacity="0.12" stroke="#B87F45" stroke-width="2"/>
<circle cx="465" cy="282" r="5" fill="#C1874B"/>

<text x="48" y="398" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#A8A29E">FIG.03 · FIND IN THE CLOUD</text>
<rect width="800" height="440" filter="url(#grain)" opacity="0.045"/>
</svg>
