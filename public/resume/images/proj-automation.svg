<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
<pattern id="dg" width="30" height="30" patternUnits="userSpaceOnUse">
<circle cx="1.1" cy="1.1" r="1" fill="#2C2A26" opacity="0.05"/>
</pattern>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="800" height="440" fill="#F1ECE3"/>
<rect width="800" height="440" fill="url(#dg)"/>

<!-- the loop -->
<circle cx="320" cy="225" r="92" fill="none" stroke="#2C2A26" stroke-width="2" stroke-dasharray="52 20.25"/>
<polygon points="320,127 320,139 334,133" fill="#2C2A26"/>
<polygon points="406,218 418,218 412,232" fill="#2C2A26"/>
<polygon points="282,299 282,311 268,305" fill="#2C2A26"/>

<!-- the mechanism -->
<circle cx="320" cy="225" r="26" fill="#F6F2EA" stroke="#2C2A26" stroke-width="2"/>
<g stroke="#2C2A26" stroke-width="2">
<line x1="320" y1="199" x2="320" y2="189"/><line x1="320" y1="251" x2="320" y2="261"/>
<line x1="294" y1="225" x2="284" y2="225"/><line x1="346" y1="225" x2="356" y2="225"/>
<line x1="302" y1="207" x2="295" y2="200"/><line x1="338" y1="243" x2="345" y2="250"/>
<line x1="302" y1="243" x2="295" y2="250"/><line x1="338" y1="207" x2="345" y2="200"/>
</g>
<circle cx="320" cy="225" r="4" fill="#2C2A26"/>

<!-- trigger -->
<circle cx="412" cy="225" r="7" fill="#C1874B"/>
<circle cx="412" cy="225" r="13" fill="none" stroke="#B87F45" stroke-opacity="0.5" stroke-width="1.3"/>

<!-- output -->
<line x1="425" y1="225" x2="556" y2="225" stroke="#2C2A26" stroke-width="2"/>
<polygon points="552,219 552,231 564,225" fill="#2C2A26"/>
<rect x="580" y="180" width="110" height="90" rx="6" fill="#F6F2EA" stroke="#2C2A26" stroke-width="2"/>
<g stroke="#2C2A26" stroke-opacity="0.5" stroke-width="1.5">
<line x1="596" y1="205" x2="674" y2="205"/>
<line x1="596" y1="225" x2="674" y2="225"/>
<line x1="596" y1="245" x2="660" y2="245"/>
</g>

<text x="48" y="398" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#A8A29E">FIG.07 · LOOP, THEN SHIP</text>
<rect width="800" height="440" filter="url(#grain)" opacity="0.045"/>
</svg>
