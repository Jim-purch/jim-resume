<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
<pattern id="dg" width="30" height="30" patternUnits="userSpaceOnUse">
<circle cx="1.1" cy="1.1" r="1" fill="#2C2A26" opacity="0.05"/>
</pattern>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="800" height="440" fill="#F1ECE3"/>
<rect width="800" height="440" fill="url(#dg)"/>

<!-- starfield -->
<g fill="#2C2A26">
<circle cx="140" cy="150" r="2" opacity="0.3"/><circle cx="200" cy="220" r="1.6" opacity="0.2"/><circle cx="240" cy="140" r="2.4" opacity="0.4"/>
<circle cx="330" cy="120" r="1.6" opacity="0.25"/><circle cx="420" cy="160" r="2" opacity="0.3"/><circle cx="500" cy="130" r="1.6" opacity="0.2"/>
<circle cx="580" cy="170" r="2.2" opacity="0.35"/><circle cx="660" cy="230" r="1.6" opacity="0.2"/><circle cx="700" cy="300" r="2" opacity="0.3"/>
<circle cx="620" cy="350" r="1.6" opacity="0.2"/><circle cx="500" cy="370" r="2" opacity="0.25"/><circle cx="380" cy="360" r="1.6" opacity="0.2"/>
<circle cx="260" cy="350" r="2" opacity="0.3"/><circle cx="160" cy="320" r="1.6" opacity="0.2"/><circle cx="120" cy="250" r="2" opacity="0.3"/>
<circle cx="300" cy="200" r="1.6" opacity="0.2"/><circle cx="540" cy="300" r="1.6" opacity="0.2"/><circle cx="450" cy="330" r="2" opacity="0.25"/>
</g>

<!-- trajectory -->
<path d="M 130 330 Q 300 312 640 170" fill="none" stroke="#A8A29E" stroke-width="1.5" stroke-dasharray="5 7"/>
<polygon points="640,170 628,172 634,182" fill="#A8A29E"/>

<!-- the ark, as a constellation -->
<g fill="none" stroke="#2C2A26" stroke-width="1.6" stroke-opacity="0.85">
<polygon points="270,282 352,232 462,214 572,246 612,300 492,322 352,312"/>
<polyline points="462,214 458,148"/>
<polygon points="458,148 546,192 462,202"/>
</g>
<g fill="#2C2A26">
<circle cx="270" cy="282" r="3.5"/><circle cx="352" cy="232" r="3.5"/><circle cx="462" cy="214" r="3.5"/>
<circle cx="572" cy="246" r="3.5"/><circle cx="612" cy="300" r="3.5"/><circle cx="492" cy="322" r="3.5"/><circle cx="352" cy="312" r="3.5"/>
</g>

<!-- the prow star: human at the helm -->
<g stroke="#B87F45" stroke-width="1.6">
<line x1="270" y1="262" x2="270" y2="302"/>
<line x1="250" y1="282" x2="290" y2="282"/>
</g>
<circle cx="270" cy="282" r="5" fill="#C1874B"/>

<!-- a distant world -->
<circle cx="690" cy="120" r="13" fill="none" stroke="#A8A29E" stroke-width="1.5"/>
<ellipse cx="690" cy="120" rx="24" ry="7" fill="none" stroke="#A8A29E" stroke-width="1" stroke-opacity="0.6" transform="rotate(-18 690 120)"/>

<text x="48" y="398" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#A8A29E">FIG.08 · STEER THE STARS</text>
<rect width="800" height="440" filter="url(#grain)" opacity="0.045"/>
</svg>
